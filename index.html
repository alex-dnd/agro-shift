<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Пятница. Релиз. Урожай — веб-игра про дежурного инженера цифровой фермы. Шесть событий, один инженер и два часа до отгрузки." />
    <title>Пятница. Релиз. Урожай</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Если игра открыта внутри iframe, сообщаем родительской странице свою высоту,
      // чтобы она могла подогнать размер фрейма без внутренней прокрутки.
      if (window.parent !== window) {
        var lastHeight = 0
        var report = function () {
          var root = document.getElementById('root')
          var h = Math.ceil(root.getBoundingClientRect().height)
          if (h !== lastHeight) {
            lastHeight = h
            window.parent.postMessage({ type: 'agro-shift:height', height: h }, '*')
          }
        }
        new ResizeObserver(report).observe(document.getElementById('root'))
        window.addEventListener('load', report)
      }
    </script>
  </body>
</html>
